      // Define o tema antes de a página aparecer, para não piscar. Escuro é o padrão.

        var tema = "escuro";
        try {
          tema = localStorage.getItem("tema") || "escuro";

        document.documentElement.dataset.tema = tema === "claro" ? "claro" : "escuro";
      })();
